name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Re-compile requirements.lock
        run: |
          uv pip compile requirements.in \
            -o requirements.lock.regen \
            --generate-hashes \
            --python-version 3.13 \
            --python-platform linux \
            --no-header \
            --quiet

      - name: Re-compile requirements-dev.lock
        run: |
          uv pip compile requirements-dev.in \
            -o requirements-dev.lock.regen \
            --generate-hashes \
            --python-version 3.13 \
            --python-platform linux \
            --no-header \
            --quiet

      - name: Fail if lockfiles drifted from .in files
        run: |
          set -e
          drift=0
          if ! diff -q <(tail -n +3 requirements.lock) requirements.lock.regen > /dev/null; then
            echo "::error::requirements.lock is stale. Regenerate with: uv pip compile requirements.in -o requirements.lock --generate-hashes --python-version 3.13 --python-platform linux"
            diff -u <(tail -n +3 requirements.lock) requirements.lock.regen | head -50 || true
            drift=1
          fi
          if ! diff -q <(tail -n +3 requirements-dev.lock) requirements-dev.lock.regen > /dev/null; then
            echo "::error::requirements-dev.lock is stale. Regenerate with: uv pip compile requirements-dev.in -o requirements-dev.lock --generate-hashes --python-version 3.13 --python-platform linux"
            diff -u <(tail -n +3 requirements-dev.lock) requirements-dev.lock.regen | head -50 || true
            drift=1
          fi
          exit $drift

  lint-and-type:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/mcp_unifi

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run pytest
        run: pytest --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-unifi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for scan job
        run: docker save mcp-unifi:ci -o /tmp/mcp-unifi.tar

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/mcp-unifi.tar

  trivy-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/mcp-unifi.tar

      - name: Trivy fs scan (Dockerfile + lockfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mcp-unifi:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
