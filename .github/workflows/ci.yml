name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify every pinned dep in source matches the lockfile
        run: |
          python3 <<'PYEOF'
          import re, sys, pathlib
          PAIRS = [
              ("requirements.in", "requirements.lock"),
              ("requirements-dev.in", "requirements-dev.lock"),
          ]
          def norm(name):
              return re.sub(r"[._-]+", "-", name.lower())
          fail = False
          for src, lock in PAIRS:
              if not pathlib.Path(src).exists() or not pathlib.Path(lock).exists():
                  continue
              lock_text = pathlib.Path(lock).read_text()
              for raw in pathlib.Path(src).read_text().splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith(("-r", "-c", "--")):
                      continue
                  m = re.match(r"^([A-Za-z0-9._-]+)(?:\[[^\]]+\])?==(\S+)\s*$", line)
                  if not m:
                      continue
                  pkg, ver = norm(m.group(1)), m.group(2)
                  hit = re.search(rf"(?im)^{re.escape(pkg)}==(\S+?)(?:\s|\\|$)", lock_text)
                  if not hit:
                      print(f"::error file={src}::{m.group(1)}=={ver} pinned in {src} but missing from {lock}")
                      fail = True
                  elif hit.group(1) != ver:
                      print(f"::error file={src}::{m.group(1)}: {src} pins =={ver} but {lock} has =={hit.group(1)}. Regenerate with: uv pip compile {src} -o {lock} --generate-hashes --python-version 3.13 --python-platform linux")
                      fail = True
          sys.exit(1 if fail else 0)
          PYEOF

  lint-and-type:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/mcp_unifi

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run pytest
        run: pytest --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  build-and-scan:
    name: Build image + Trivy scan
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-unifi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executes the
        # *image's* interpreter. That let a Dependabot digest bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 and ship a runtime no lockfile
        # or check had exercised, with CI fully green throughout.
        #
        # requirements*.lock are compiled with --python-version 3.13 and
        # pyproject targets py313, so the image must agree. --entrypoint is
        # required: the image's ENTRYPOINT is the server itself.
        run: |
          docker run --rm --entrypoint python mcp-unifi:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but pyproject, "
              f"the CI matrix and requirements*.lock all target "
              f"{want[0]}.{want[1]}. Fix the Dockerfile FROM tag, or retarget "
              f"every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '

      - name: Trivy fs scan (Dockerfile + lockfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mcp-unifi:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
