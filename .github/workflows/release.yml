name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # softprops/action-gh-release attaches SBOM + .dxt to the release
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + Push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify version surfaces match the tag
        # Fail closed: the released artifacts must describe the version their
        # tag claims. This checks every place a release version lives against
        # the tag name. Historically release.yml sed-bumped these files inside
        # the runner and pushed the fix to main after the build, which meant
        # tags v0.10.0 through v0.16.0 all misreported their own version.
        # v0.16.1 moved the bump before the tag; this step enforces that
        # invariant so a future stale tag fails the release immediately
        # instead of being silently repaired.
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "Verifying every version surface matches tag ${REF_NAME} (${VERSION})..."

          fail=0
          check() {
            local label="$1"
            local expected="$2"
            local actual="$3"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${label} is '${actual}', expected '${expected}'"
              fail=1
            else
              echo "  ok  ${label} = ${actual}"
            fi
          }

          pyproject=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          init=$(grep -E '^__version__ = ' src/mcp_unifi/__init__.py | head -1 | sed -E 's/__version__ = "([^"]+)"/\1/')
          manifest=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          server_version=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          server_oci=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          expected_oci="ghcr.io/${REPO}:${VERSION}"
          compose_image=$(grep -E "image: ghcr\.io/${REPO}:" docker-compose.yml | head -1 | sed -E 's/.*image: (.+)/\1/')
          chart_app=$(grep -E '^appVersion:' charts/mcp-unifi/Chart.yaml | head -1 | sed -E 's/appVersion: "?([^"]+)"?/\1/')

          check "pyproject.toml version" "${VERSION}" "${pyproject}"
          check "src/mcp_unifi/__init__.py __version__" "${VERSION}" "${init}"
          check "manifest.json version" "${VERSION}" "${manifest}"
          check "server.json version" "${VERSION}" "${server_version}"
          check "server.json packages[0].identifier" "${expected_oci}" "${server_oci}"
          check "docker-compose.yml image" "${expected_oci}" "${compose_image}"
          check "charts/mcp-unifi/Chart.yaml appVersion" "${VERSION}" "${chart_app}"

          if [ "${fail}" -ne 0 ]; then
            echo ""
            echo "::error::Version surfaces disagree with tag ${REF_NAME}."
            echo "::error::Bump every surface in a commit BEFORE cutting the tag."
            echo "::error::See CONTRIBUTING.md for the release procedure."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          artifact-name: mcp-unifi-${{ github.ref_name }}-sbom.cyclonedx.json
          output-file: /tmp/sbom.cyclonedx.json
          format: cyclonedx-json

      - name: Set up Python for .dxt build
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build .dxt bundle
        id: dxt
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist/dxt/bundle
          python -m pip install --upgrade pip
          pip install --target dist/dxt/bundle .
          cp manifest.json dist/dxt/manifest.json
          cd dist/dxt
          zip -r "../../mcp-unifi-${VERSION}.dxt" .

      - name: Extract release notes from CHANGELOG
        # Reads the CHANGELOG section whose header matches this tag's version
        # (e.g. "## [0.17.0]") up to the next "## [" header. Writes to
        # /tmp/release-notes.md so softprops/action-gh-release can consume it
        # via body_path. Fails closed if the section is missing or empty so
        # a release without CHANGELOG entries never ships with an empty body.
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::CHANGELOG has no section for ${VERSION}. Add a '## [${VERSION}]' entry before tagging."
            exit 1
          fi
          echo "Extracted $(wc -l < /tmp/release-notes.md) lines of notes for ${VERSION}."

      - name: Attach release artifacts (SBOM + .dxt) and notes
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          files: |
            /tmp/sbom.cyclonedx.json
            mcp-unifi-${{ steps.dxt.outputs.version }}.dxt
