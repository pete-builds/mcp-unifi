---
version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: thursday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
  groups:
    python-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    day: thursday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: deps(docker)
    include: scope
  groups:
    docker-minor-patch:
      update-types:
      - minor
      - patch
  # The Python line is pinned on purpose: pyproject, the CI matrix, both uv locks and
  # the image-version guard in ci.yml all target 3.13, and Dependabot reads 3.13 -> 3.14
  # as a "minor" that the auto-merge workflow would arm. Moving the interpreter is a
  # coordinated retarget of every version surface, never a dependency bump. Digest
  # updates on the pinned line still flow.
  ignore:
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: thursday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
# The docs site is a separate npm project. Without this block nothing watches
# it, which is how nanoid CVE-2026-67213 sat open with no PR to fix it.
- package-ecosystem: npm
  directory: "/docs/site"
  schedule:
    interval: weekly
    day: thursday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - javascript
  commit-message:
    prefix: deps(docs)
    include: scope
  groups:
    npm-minor-patch:
      update-types:
      - minor
      - patch
