replicaCount: 1

image:
  repository: ghcr.io/pete-builds/mcp-unifi
  pullPolicy: IfNotPresent
  # Defaults to Chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# UniFi controller configuration
# Option A: single controller via env vars (simple)
unifi:
  host: ""
  apiKey: ""
  port: 443
  site: default
  verifySSL: false
  stubMode: false

# Option B: multi-controller via existing Secret (advanced).
# When set, the chart will NOT render its own Secret. The referenced Secret
# must expose at least the UNIFI_API_KEY key.
existingSecret: ""

modulesEnabled: "network"

service:
  type: ClusterIP
  port: 3714

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3714
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3714
  initialDelaySeconds: 5
  periodSeconds: 10

# Prometheus scraping. Off by default; flip prometheus.io/scrape to "true"
# to opt in once a /metrics endpoint is exposed.
podAnnotations:
  prometheus.io/scrape: "false"
  prometheus.io/port: "3714"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-unifi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressRules: []
  egressRules: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
