apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-unifi.fullname" . }}
  labels:
    {{- include "mcp-unifi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-unifi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-unifi.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ .Values.service.port | quote }}
            - name: STUB_MODE
              value: {{ .Values.unifi.stubMode | quote }}
            - name: UNIFI_HOST
              value: {{ .Values.unifi.host | quote }}
            - name: UNIFI_PORT
              value: {{ .Values.unifi.port | quote }}
            - name: UNIFI_SITE
              value: {{ .Values.unifi.site | quote }}
            - name: UNIFI_VERIFY_SSL
              value: {{ .Values.unifi.verifySSL | quote }}
            - name: MCP_UNIFI_MODULES_ENABLED
              value: {{ .Values.modulesEnabled | quote }}
            - name: MCP_UNIFI_AUTH_REQUIRED
              value: {{ .Values.auth.required | quote }}
            {{- if or .Values.existingSecret .Values.unifi.apiKey }}
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: UNIFI_API_KEY
            {{- end }}
            {{- if or .Values.existingSecret .Values.auth.tokens }}
            - name: MCP_UNIFI_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: MCP_UNIFI_AUTH_TOKENS
                  optional: {{ ternary "true" "false" (not .Values.auth.tokens) }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
