apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-unifi.fullname" . }}
  labels:
    {{- include "mcp-unifi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-unifi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $chartSecret := and (not .Values.existingSecret) (or .Values.unifi.apiKey .Values.auth.tokens) }}
      {{- if or $chartSecret .Values.podAnnotations }}
      annotations:
        {{- if $chartSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "mcp-unifi.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ .Values.service.port | quote }}
            - name: STUB_MODE
              value: {{ .Values.unifi.stubMode | quote }}
            - name: UNIFI_HOST
              value: {{ .Values.unifi.host | quote }}
            - name: UNIFI_PORT
              value: {{ .Values.unifi.port | quote }}
            - name: UNIFI_SITE
              value: {{ .Values.unifi.site | quote }}
            {{- if not (kindIs "invalid" .Values.unifi.verifySSL) }}
            - name: UNIFI_VERIFY_SSL
              value: {{ .Values.unifi.verifySSL | quote }}
            {{- end }}
            - name: MCP_UNIFI_MODULES_ENABLED
              value: {{ .Values.modulesEnabled | quote }}
            - name: MCP_UNIFI_AUTH_REQUIRED
              value: {{ .Values.auth.required | quote }}
            - name: MCP_UNIFI_READONLY
              value: {{ .Values.readOnly | quote }}
            - name: MCP_UNIFI_COMPACT_RESPONSES
              value: {{ .Values.compactResponses | quote }}
            - name: MCP_UNIFI_AUDIT_SINK
              value: {{ .Values.audit.sink | quote }}
            {{- if .Values.audit.path }}
            - name: MCP_UNIFI_AUDIT_PATH
              value: {{ .Values.audit.path | quote }}
            {{- end }}
            {{- if or .Values.existingSecret .Values.unifi.apiKey }}
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: UNIFI_API_KEY
                  {{- if or .Values.unifi.stubMode (not .Values.unifi.host) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.existingSecret .Values.auth.tokens }}
            - name: MCP_UNIFI_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: MCP_UNIFI_AUTH_TOKENS
                  optional: {{ ternary "true" "false" (not .Values.auth.tokens) }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
